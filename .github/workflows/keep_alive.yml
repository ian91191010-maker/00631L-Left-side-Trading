name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小時執行一次（UTC 時間）
  workflow_dispatch:         # 允許在 GitHub 網頁上手動按「Run workflow」測試

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ▼▼▼ 只需要改這一行：換成你的 Streamlit 網址 ▼▼▼
      APP_URL: "https://00631l-left-side-trading-j2ewt58toqbedb2z5reulf.streamlit.app/"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app (wake it up if it is asleep)
        run: |
          cat > visit.py <<'PY'
          import os
          import re
          import sys

          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          wake_text = re.compile("get this app back up", re.I)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90_000)
              page.wait_for_timeout(10_000)

              wake_button = page.get_by_role("button", name=wake_text)
              if wake_button.count() > 0:
                  print("App was asleep. Clicking the wake-up button...")
                  wake_button.first.click()
                  page.wait_for_timeout(60_000)
              else:
                  print("No wake-up button. App is already awake.")

              still_asleep = page.get_by_role("button", name=wake_text).count() > 0
              print("Page title:", page.title())
              browser.close()

          if still_asleep:
              print("The app still shows the wake-up button.")
              sys.exit(1)
          print("OK")
          PY
          python visit.py
